version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: ai_adminhelper_db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dein_sicheres_db_passwort}
    volumes:
      # Hier werden die Daten dauerhaft auf dem Host/Server gespeichert
      - pgdata:/var/lib/postgresql/data
      # Schema-Initialisierung beim allerersten Start der DB
      - ./supabase/schema_full.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      # Optional: Port freigeben für Backups oder externe Verwaltung
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:v12.2.0
    container_name: ai_adminhelper_postgrest
    restart: always
    environment:
      # Verbindung zur PostgreSQL-Datenbank
      # PGRST_DB_URI wird primär aus DATABASE_URL (von Coolify injiziert) gelesen.
      # Fallback ist der lokale 'db' Service.
      PGRST_DB_URI: ${DATABASE_URL:-postgres://postgres:${DB_PASSWORD:-dein_sicheres_db_passwort}@db:5432/postgres}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: postgres
      PGRST_JWT_SECRET: ${JWT_SECRET:-mindestens_32_zeichen_langes_geheimnis_hier_einfuegen}
      PGRST_PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3000"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_adminhelper_app
    restart: always
    environment:
      PORT: 3000
      DB_SELF_HOSTED: "true"
      # Verweist intern auf den PostgREST-Container
      SUPABASE_URL: http://postgrest:3000
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${DB_PASSWORD:-dein_sicheres_db_passwort}@db:5432/postgres}
      JWT_SECRET: ${JWT_SECRET:-mindestens_32_zeichen_langes_geheimnis_hier_einfuegen}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      XAI_API_KEY: ${XAI_API_KEY}
      APP_URL: ${APP_URL}
      SELLAUTH_API_KEY: ${SELLAUTH_API_KEY}
      SELLAUTH_SHOP_ID: ${SELLAUTH_SHOP_ID}
      SELLAUTH_SHOP_URL: ${SELLAUTH_SHOP_URL}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
    depends_on:
      - postgrest
    ports:
      - "3000:3000"

volumes:
  pgdata:
    driver: local

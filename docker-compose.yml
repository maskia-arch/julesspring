version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: ai_adminhelper_db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dein_sicheres_db_passwort}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/schema_full.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_adminhelper_app
    restart: always
    environment:
      PORT: 3000
      DB_SELF_HOSTED: "true"
      # PostgREST läuft nun als lokaler Hintergrundprozess im selben Container
      SUPABASE_URL: http://localhost:3000
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${DB_PASSWORD:-dein_sicheres_db_passwort}@ai_adminhelper_db:5432/postgres}
      JWT_SECRET: ${JWT_SECRET:-mindestens_32_zeichen_langes_geheimnis_hier_einfuegen_das_sehr_lang_ist}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      XAI_API_KEY: ${XAI_API_KEY}
      APP_URL: ${APP_URL}
      SELLAUTH_API_KEY: ${SELLAUTH_API_KEY}
      SELLAUTH_SHOP_ID: ${SELLAUTH_SHOP_ID}
      SELLAUTH_SHOP_URL: ${SELLAUTH_SHOP_URL}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
    depends_on:
      - db
    ports:
      - "${PORT:-4444}:3000"
    networks:
      - coolify

networks:
  coolify:
    name: coolify
    external: true

volumes:
  pgdata:
    driver: local
